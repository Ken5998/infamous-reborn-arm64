name: Installer build

# inFAMOUS Reborn's own installer (MIT, installer/ in its repository) is what reads the disc and
# regenerates the game code. ArmadaOS has no Rust, so scripts/build.sh downloads this build of it,
# made from the commit pinned in upstream.json with patches/upstream, from the release
# installer-<commit>-<patches> (scripts/common.sh installer_tag).
on:
  push:
    branches: [main]
    paths: [upstream.json, patches/upstream/**, .github/workflows/installer.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Upstream at the pinned commit
        run: scripts/prepare.sh work
      - name: Build
        run: |
          cd work/inFAMOUSreborn/installer
          cargo build --release --locked --no-default-features --bin infamous-installer
          cp target/release/infamous-installer "$GITHUB_WORKSPACE/infamous-installer-linux-arm64"
          cp LICENSE* "$GITHUB_WORKSPACE/" 2>/dev/null || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          c=$(python3 -c 'import json; print(json.load(open("upstream.json"))["infamous"]["commit"][:12])')
          tag=$(repo=$PWD bash -c '. scripts/common.sh && installer_tag')
          notes="inFAMOUS Reborn's command-line installer (MIT, by whompay) built for linux-arm64 from https://github.com/whompay/inFAMOUSreborn/tree/$c/installer with this repository's patches/upstream. scripts/build.sh downloads it; you do not need it by hand."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" infamous-installer-linux-arm64 --clobber
          else
            gh release create "$tag" infamous-installer-linux-arm64 --title "inFAMOUS Reborn installer $c" \
              --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
